[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbine-whisperer"
version = "0.0.1"
description = "An AI agent that watches a simulated gas turbine over Modbus TCP, with a human approval gate on every write."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Destany Brown" }]
dependencies = [
    "pymodbus>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
claude = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]
